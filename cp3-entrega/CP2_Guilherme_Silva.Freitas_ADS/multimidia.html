<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimídia - Guilherme Freitas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">GF Portfólio</a>

            <button class="btn-menu" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav id="menu-principal">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="curriculo.html">Currículo</a></li>
                    <li><a href="formulario.html">Contato</a></li>
                    <li><a href="multimidia.html">Multimídia</a></li>
                    <li><a href="graficos.html">Gráficos</a></li>
                    <li><a href="contato.html">Redes para contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1>Multimídia</h1>

        <!-- Vídeo responsivo -->
        <section class="video-section">
            <h2>Vídeo de Apresentação</h2>
            <article>
                <p>Confira um vídeo de apresentação:</p>
                <video controls>
                    <source src="img/videoteste.mp4" type="video/mp4">
                    Seu navegador não suporta o elemento de vídeo.
                </video>
            </article>
        </section>




    </main>

    <footer>
        <p>Guilherme Freitas &mdash; Portfólio Acadêmico &copy; 2025</p>
    </footer>
    <script>
        (function () {
            var btn = document.querySelector('.btn-menu');
            var nav = document.getElementById('menu-principal');
            if (!btn || !nav) return;

            btn.addEventListener('click', function () {
                var aberto = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', String(!aberto));
                nav.classList.toggle('aberto', !aberto);
            });

            nav.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () {
                    btn.setAttribute('aria-expanded', 'false');
                    nav.classList.remove('aberto');
                });
            });
        })();
    </script>
</body>

</html>
